name: Deploy English Grammar App

on:
  push:
    branches: [main]
    paths:
      - public/english-grammar-app/**
      - .github/workflows/english-grammar-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: english-grammar-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify application files
        run: |
          test -f public/english-grammar-app/index.html
          test -f public/english-grammar-app/app.js
          test -f public/english-grammar-app/questions-loader.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/english-grammar-app
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
